<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ein Tag. Eine Zeile. – Designvorschau</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e8e5;color:#171717;font-family:Georgia,'Times New Roman',serif}button,input{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #222;background:#fff;border-radius:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #111;outline-offset:3px}.device{width:600px;height:800px;max-width:100%;margin:24px auto;background:#fff;padding:16px;display:flex;flex-direction:column}header{height:64px;flex-shrink:0;position:relative;border-bottom:2px solid #111}.eyebrow{font:9px Arial,sans-serif;letter-spacing:1.8px;margin:0 0 9px}h1{margin:0;font-size:26px;font-weight:400;line-height:32px;max-width:calc(100% - 190px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav{position:absolute;right:0;bottom:12px;display:flex;gap:5px}.nav button{height:34px;min-width:32px;font-size:16px}.nav .today{font-size:12px;padding:0 10px}.nav .close{margin-left:6px}.grid{flex:1;min-height:0;display:grid;grid-template-rows:74px repeat(16,minmax(0,1fr));grid-template-columns:48px minmax(0,1fr) repeat(5,48px)}.heading{border-bottom:1px solid #555;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font:9px Arial,sans-serif}.heading.note-heading{justify-content:flex-start;font-size:9px;padding-left:10px}.heading.vertical{padding:0;align-items:center;overflow:hidden}.vertical span{display:block;position:absolute;white-space:nowrap;font:11px Arial,sans-serif;transform:rotate(-90deg);max-width:72px;overflow:hidden;text-overflow:ellipsis}.cell{min-width:0;border-bottom:1px solid #ccc;display:flex;align-items:center;justify-content:center}.day{flex-direction:column;font-family:Arial,sans-serif;font-size:13px;line-height:16px}.day small{font-size:9px;line-height:11px}.day.current{color:#fff;background:#171717}.note{justify-content:flex-start;border-left:1px solid #ccc;padding:0 9px;background:white;overflow:hidden;cursor:pointer}.note span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note.empty{color:#888;font-style:italic}.metric{border-left:1px solid #ccc}.tile{height:32px;width:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid #d4d4d4;min-width:0;font:13px Arial,sans-serif}.tile.on{background:#171717;border-color:#171717}.tile.sport{border-color:transparent}.tile.missing{border-color:transparent;color:#777}.sport-icons{display:grid;grid-template-columns:repeat(var(--cols,1),1fr);align-items:center;justify-items:center;max-height:100%;gap:1px}.sport-icons img{width:25px;height:25px}.sport-icons.multiple img{width:14px;height:14px}.footer{height:49px;flex-shrink:0;margin-top:8px;border-top:1px solid #444;padding-top:10px;display:flex;justify-content:space-between;align-items:flex-start}.footer button{height:30px;padding:0 10px;font:11px Arial,sans-serif}.footer-left{display:flex;align-items:center;gap:12px}.footer small{font:10px Arial,sans-serif;color:#666}.halves{display:flex;gap:5px}.active{background:#171717!important;color:white!important}.caption{max-width:600px;margin:12px auto 24px;font:12px/1.6 Arial,sans-serif;padding:0 12px;color:#555}.shade{position:fixed;inset:0;background:#0005;display:grid;place-items:center;padding:20px}.shade[hidden]{display:none}.dialog{width:380px;max-width:100%;border:2px solid #171717;background:#fff;padding:24px;box-shadow:0 8px 40px #0002}.dialog .eyebrow{margin-bottom:12px}h2{font-weight:400;font-size:25px;margin:0 0 12px}.hint{font:12px/1.5 Arial,sans-serif;color:#555}.score{font:48px Arial,sans-serif;text-align:center;margin:20px 0 14px}.slider-row{display:flex;align-items:center;gap:15px}.slider-row button{width:36px;height:36px;flex-shrink:0;font-size:22px}input[type=range]{accent-color:#171717;min-width:0;width:100%;height:34px}.scale{display:flex;justify-content:space-between;font:10px Arial,sans-serif;margin:4px 51px 20px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.dialog-actions button{padding:9px 12px;font:12px Arial,sans-serif}.clear{border:0;padding:0;text-decoration:underline;font:12px Arial,sans-serif}textarea{width:100%;height:160px;padding:10px;font:16px/1.6 Georgia,serif;border:1px solid #999}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{display:flex;gap:8px;align-items:center;padding:8px;font:12px Arial,sans-serif}.choice img{width:24px;height:24px}.check-list{display:grid;gap:8px;font:14px Arial,sans-serif}.check-list label{display:flex;align-items:center;gap:8px}.status{font:11px Arial,sans-serif;margin-top:16px}.closed{padding:100px 20px;text-align:center}.closed button{padding:12px}.device[data-count="6"] .grid{grid-template-columns:48px minmax(0,1fr) repeat(6,48px)}@media(max-width:620px){.device{margin:0 auto}.footer small{display:none}}@media(max-width:500px){.device{padding:10px}.grid{grid-template-columns:42px minmax(0,1fr) repeat(5,42px)}h1{font-size:21px}.device[data-count="6"] .grid{grid-template-columns:42px minmax(0,1fr) repeat(6,42px)}}
</style>
</head>
<body>
<main class="device" id="device">
<header><p class="eyebrow">EIN TAG. EINE ZEILE.</p><h1 id="monthTitle"></h1><nav class="nav" aria-label="Monatsnavigation"><button id="prev" aria-label="Voriger Monat">‹</button><button id="today" class="today">Heute</button><button id="next" aria-label="Nächster Monat">›</button><button class="close" id="close" aria-label="Ansicht schließen">×</button></nav></header>
<section class="grid" id="grid" aria-label="Tagebuch-Monatshälfte"></section>
<footer class="footer"><div class="footer-left"><button id="columns">Spalten</button><small id="footerHint">Vorschau · Beispieldaten</small></div><div class="halves" aria-label="Monatshälfte"><button id="first">1–15</button><button id="second">16–31</button></div></footer>
</main>
<p class="caption">Interaktive Designvorschau mit erfundenen Daten. Zeile oder Kachel antippen. Änderungen gelten nur bis zum Neuladen; es werden keine Daten gespeichert oder synchronisiert. Schrift und Darstellung auf dem Kindle können abweichen.</p>
<div class="shade" id="shade" hidden><section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const names=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const weekdays=['So','Mo','Di','Mi','Do','Fr','Sa'];
const sports=[['swimming','Schwimmen'],['cycling','Radfahren'],['running','Laufen'],['football','Fußball'],['padel','Padel']];
const icon=id=>'../koreader/ebookdiary.koplugin/icons/'+id+'.svg';
let month='2026-10',half=2,editing=null,columns=[{id:'sport',label:'Sport',type:'sport'},{id:'sleep',label:'Sleep Score',type:'sleep'},{id:'outside',label:'Draußen',type:'habit'},{id:'reading',label:'Lesen',type:'habit'},{id:'food',label:'Gut gegessen',type:'habit'}],customId=1;
const data={};
const texts=['Sonne am See und eine Runde schwimmen.','Heute bewusst Zeit fürs Lesen genommen.','Mit dem Rad durch die Herbstluft.','Laufen, danach zusammen gekocht.','Fußball mit Freunden.','Zum ersten Mal wieder Padel gespielt.','Ein ruhiger Sonntag.'];
for(let d=1;d<=31;d++){data['2026-10-'+String(d).padStart(2,'0')]={text:d>=16&&d<=22?texts[d-16]:'',score:d===23?null:[72,86,91,64,88,79,95][(d-1)%7],sports:d===16?['swimming','cycling','running']:d>=17&&d<=21?[sports[d-17][0]]:[],habits:{outside:d%3!==0,reading:d%2===0,food:d%4!==0}};}
function entry(date){return data[date]||(data[date]={text:'',score:null,sports:[],habits:{}});}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function button(cls,label,action){const b=el('button',cls);b.setAttribute('aria-label',label);b.onclick=action;return b;}
function openDialog(title){$('dialog').replaceChildren();const titleEl=el('h2','',title);titleEl.id='dialogTitle';$('dialog').append(titleEl);editing=document.activeElement;$('shade').hidden=false;return $('dialog');}
function closeDialog(){$('shade').hidden=true;render();if(editing&&editing.isConnected)editing.focus();}
function actions(dialog,save){const row=el('div','dialog-actions');const cancel=button('','Abbrechen',closeDialog);cancel.textContent='Abbrechen';const submit=button('active','Speichern',save);submit.textContent='Speichern';row.append(cancel,submit);dialog.append(row);}
function sportIcons(ids){const wrap=el('span','sport-icons'+(ids.length>1?' multiple':''));wrap.style.setProperty('--cols',ids.length>4?3:ids.length>1?2:1);for(const id of ids){const img=el('img');img.src=icon(id);img.alt=sports.find(s=>s[0]===id)[1];wrap.append(img);}return wrap;}
function editScore(date){const e=entry(date),dialog=openDialog('Sleep Score');dialog.prepend(el('p','eyebrow',date.split('-').reverse().join('.')));dialog.append(el('p','hint','Wie erholt hast du geschlafen? 0 = niedrig, 100 = hoch.'));
let value=e.score===null?75:e.score,missing=e.score===null;
const output=el('div','score');output.id='scoreOutput';const row=el('div','slider-row'),slider=el('input');slider.type='range';slider.min=0;slider.max=100;slider.step=1;slider.value=value;slider.id='sleepSlider';slider.setAttribute('aria-label','Sleep Score');const update=()=>{output.textContent=missing?'—':value;slider.value=value;slider.setAttribute('aria-valuetext',missing?'Kein Wert':String(value));};const change=n=>{missing=false;value=Math.max(0,Math.min(100,Number(n)));update();};const minus=button('','Sleep Score verringern',()=>change(value-1));minus.textContent='−';const plus=button('','Sleep Score erhöhen',()=>change(value+1));plus.textContent='+';slider.oninput=()=>change(slider.value);row.append(minus,slider,plus);const scale=el('div','scale');scale.append(el('span','','0'),el('span','','100'));dialog.append(output,row,scale);const clear=button('clear','Schlafwert entfernen',()=>{missing=true;update();});clear.textContent='Keinen Wert eintragen';dialog.append(clear);actions(dialog,()=>{e.score=missing?null:value;closeDialog();});update();slider.focus();}
function editText(date){const e=entry(date),dialog=openDialog('Was bleibt von heute?');dialog.prepend(el('p','eyebrow',date.split('-').reverse().join('.')));const input=el('textarea');input.value=e.text;input.setAttribute('aria-label','Tagebucheintrag');dialog.append(input);actions(dialog,()=>{e.text=input.value;closeDialog();});input.focus();}
function editSports(date){const e=entry(date),selected=new Set(e.sports),dialog=openDialog('Sportarten'),choices=el('div','choices');for(const [id,label] of sports){const b=button('choice'+(selected.has(id)?' active':''),label,()=>{if(selected.has(id))selected.delete(id);else selected.add(id);b.classList.toggle('active',selected.has(id));b.setAttribute('aria-pressed',selected.has(id));});b.setAttribute('aria-pressed',selected.has(id));const img=el('img');img.src=icon(id);img.alt='';b.append(img,el('span','',label));choices.append(b);}dialog.append(choices);actions(dialog,()=>{e.sports=[...selected];closeDialog();});}
function editColumns(){const dialog=openDialog('Spalten'),list=el('div','check-list');const selected=new Set(columns.filter(c=>!c.hidden).map(c=>c.id));for(const col of columns){const label=el('label'),check=el('input');check.type='checkbox';check.checked=selected.has(col.id);check.onchange=()=>{if(check.checked&&selected.size>=6){check.checked=false;return;}if(check.checked)selected.add(col.id);else selected.delete(col.id);};label.append(check,el('span','',col.label));list.append(label);}dialog.append(list);const add=el('input');add.type='text';add.placeholder='Eigener Tracker …';add.setAttribute('aria-label','Name der neuen Spalte');add.style.cssText='width:100%;padding:8px;margin-top:20px;border:1px solid #888';dialog.append(add);const status=el('p','hint','Bis zu sechs Kachelspalten gleichzeitig.');dialog.append(status);actions(dialog,()=>{const label=add.value.trim();if(label&&selected.size>=6){status.textContent='Zuerst eine Spalte ausblenden.';return;}for(const col of columns)col.hidden=!selected.has(col.id);if(label)columns.push({id:'custom_'+customId++,label,type:'habit'});closeDialog();});}
function render(){const [y,m]=month.split('-').map(Number),count=new Date(y,m,0).getDate(),start=half===1?1:16,end=half===1?15:count,visible=columns.filter(c=>!c.hidden),grid=$('grid');$('device').dataset.count=visible.length;$('monthTitle').textContent=names[m-1]+' '+y;$('first').classList.toggle('active',half===1);$('second').classList.toggle('active',half===2);$('second').textContent='16–'+count;grid.style.gridTemplateColumns='48px minmax(0,1fr) repeat('+visible.length+',48px)';grid.replaceChildren();grid.append(el('div','heading','TAG'),el('div','heading note-heading','WAS BLEIBT VON HEUTE?'));for(const col of visible){const h=el('div','heading vertical');h.append(el('span','',col.label));h.title=col.label;grid.append(h);}for(let d=start;d<=end;d++){const date=month+'-'+String(d).padStart(2,'0'),e=entry(date),day=el('div','cell day'+(date==='2026-10-16'?' current':''));day.append(el('span','',d),el('small','',weekdays[new Date(y,m-1,d).getDay()]));const note=el('div','cell note'+(e.text?'':' empty'));const nb=button('',date+' bearbeiten',()=>editText(date));nb.style.cssText='border:0;background:transparent;text-align:left;padding:0;max-width:100%;overflow:hidden';nb.append(el('span','',e.text||'Eintrag hinzufügen'));note.append(nb);grid.append(day,note);for(const col of visible){const cell=el('div','cell metric'),b=button('tile',col.label+' am '+date,()=>{if(col.type==='sleep')editScore(date);else if(col.type==='sport')editSports(date);else{e.habits[col.id]=!e.habits[col.id];render();}});b.dataset.date=date;b.dataset.column=col.id;if(col.type==='sleep'){if(e.score===null){b.classList.add('missing');b.textContent='—';}else{const shade=255-Math.floor(e.score*2.35);b.style.backgroundColor='rgb('+shade+','+shade+','+shade+')';b.style.color=shade<130?'white':'#171717';b.style.borderColor='transparent';b.textContent=e.score;}}else if(col.type==='sport'){b.classList.add('sport');if(e.sports.length)b.append(sportIcons(e.sports));else b.textContent='—';}else{b.classList.toggle('on',!!e.habits[col.id]);b.setAttribute('aria-pressed',!!e.habits[col.id]);}cell.append(b);grid.append(cell);}}}
function shift(n){const [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');half=1;render();}
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('today').onclick=()=>{month='2026-10';half=2;render();};$('first').onclick=()=>{half=1;render();};$('second').onclick=()=>{half=2;render();};$('columns').onclick=editColumns;$('close').onclick=()=>{const dialog=openDialog('Vorschau schließen');dialog.append(el('p','hint','Auf dem Kindle kehrst du hier zu KOReader zurück.'));const back=button('','Zur Vorschau',closeDialog);back.textContent='Zur Vorschau';back.style.padding='10px';dialog.append(back);};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('shade').hidden)closeDialog();});$('shade').onclick=e=>{if(e.target===$('shade'))closeDialog();};render();
</script>
</body>
</html>
